buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.21"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    // Ravelin - optional - only required if you are using Ravelin
    maven {
      url 'https://maven.ravelin.com/public/repositories/core-android/'
    }
    // This is for Detox test framework
    maven { url("$rootDir/../node_modules/detox/Detox-android") }
  }
}

// NDK r27 links native libraries with 4 KB page alignment by default. Libraries that build
// C++ from source (e.g. react-native-mmkv-storage) need this flag to be 16 KB page compatible.
// See https://developer.android.com/guide/practices/page-sizes
subprojects {
  plugins.withId("com.android.library") {
    android.defaultConfig.externalNativeBuild.cmake.arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
  }
}

apply plugin: "com.facebook.react.rootproject"
